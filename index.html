<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ministry Media Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one ranked ledger down the page; portraits carry identity, one red carries every count */
:root{
  color-scheme: light;
  --paper:#f6f3ec; --paper2:#efebe1; --ink:#1c1b19; --ink2:#55524b; --muted:#8a867c; --rule:#dcd7ca; --hair:#e6e2d7;
  --labor:#c63a3a; --labor-2:#e39a97; --labor-3:#f1cfcc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.005em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
#prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:2px;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);z-index:45}

/* motion */
.js .reveal:not(.in):not(.byword){opacity:0}
.reveal.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.byword .w{display:inline-block}
.js .byword:not(.in) .w{opacity:0}
.byword.in{animation:none}
.byword.in .w{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*75ms)}
.lede.reveal.in{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}}
@keyframes growW{from{width:0}}
@keyframes growH{from{transform:scaleY(0)}}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.js .reveal:not(.in),.js .byword:not(.in) .w{opacity:1!important;transform:none!important}}

/* hero */
.hero{border-bottom:1px solid var(--rule);padding-block:clamp(56px,10vh,110px) clamp(40px,7vh,80px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:32px;align-items:center}
.hero .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.hero h1{font-size:clamp(40px,6.4vw,80px);line-height:1.02;max-width:8ch}
#pack{position:relative;height:clamp(320px,44vw,480px)}
#pack .b{position:absolute;border-radius:50%;border:2px solid var(--labor);padding:2px;background:var(--paper)}
#pack .b img,#pack .b .ph{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--paper2)}
#pack .b .ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink2)}
#pack.in .b{animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*38ms)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}}

/* sections */
.sec{padding:110px 0 92px;border-bottom:1px solid var(--rule)}
.sec h2{font-size:clamp(30px,4.4vw,48px);line-height:1.08;margin:0 0 18px}
.lede{font-family:var(--serif);font-size:clamp(19px,2.1vw,23px);line-height:1.45;color:var(--ink2);max-width:40ch}
.lede b{color:var(--ink);font-weight:600}
.viz{margin-top:44px}
.sub{font-family:var(--serif);font-size:20px;margin:0 0 16px}
@media (max-width:820px){.sec{padding:80px 0 64px}}
.face{border-radius:50%;object-fit:cover;background:var(--paper2);flex:none;display:block}
.face.ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink2)}
.ring{border-radius:50%;padding:2px;border:2px solid var(--labor);flex:none;display:inline-flex}

/* ranked tables: rows re-sort in place; the header is pinned above a body that may scroll sideways */
.tb .pin{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);overflow:hidden;border-bottom:1px solid var(--ink)}
.tb .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb .hd,.tb .rank{min-width:var(--minw,0)}
.tb .hd,.tb .rw{display:grid;grid-template-columns:var(--cols);gap:0 14px;align-items:center}
.tb .hd{padding:10px 0 8px;font-size:12.5px;color:var(--ink2)}
.tb .hd button{text-align:left;line-height:1.2;padding:4px 0;border-bottom:2px solid transparent}
.tb .hd button:hover,.tb .hd button:focus-visible{color:var(--ink)}
.tb .hd button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--labor)}
.rank .rw{padding:9px 0;border-bottom:1px solid var(--hair);position:relative;background:var(--paper)}
.rank .rk{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.rank .who{min-width:0}
.rank .who b{display:block;font-weight:500;font-size:15px;line-height:1.25}
.rank .who span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.rank .c{font-variant-numeric:tabular-nums;font-size:14px;line-height:1.1}
.rank .c.on{font-weight:600}
.rank .c.z{color:var(--muted)}
.rank .c i{display:block;height:5px;margin-top:5px;background:var(--labor);border-radius:0 2px 2px 0;min-width:0}
.rank .c.t{font-family:var(--serif);font-size:21px}
.rank .c.t i{height:7px}
.in .rank .rw{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(min(var(--r),18)*40ms)}
.in .rank .c i{animation:growW .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--r),18)*40ms + .25s)}
#tbl-w{--cols:26px 40px minmax(176px,1.4fr) repeat(8,minmax(64px,1fr));--minw:990px}

/* circles for the shows */
#bf-w{--cols:26px 36px minmax(150px,1.2fr) repeat(6,minmax(60px,1fr)) 54px;--minw:820px}
#fl-w{--cols:26px 36px minmax(150px,1.2fr) repeat(2,minmax(84px,1fr)) 54px;--minw:480px;max-width:760px}
.bbt .rw{padding:5px 0}
.bb{display:flex;align-items:center;justify-content:flex-start;height:46px}
.bb span{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--labor);color:#fff;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.bb span.z{background:var(--rule);width:5px!important;height:5px!important}
.in .bb span{animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(min(var(--r),18)*40ms + var(--k)*60ms + .2s)}
.rounds{margin-top:56px}
.rounds .sub{margin-bottom:4px}
.subnote{font-size:14px;color:var(--ink2);margin:0 0 20px}
@media (max-width:620px){#tbl-w{--cols:18px 32px 132px repeat(8,58px);--minw:720px}#bf-w{--cols:18px 30px 118px repeat(6,52px) 40px;--minw:600px}#fl-w{--cols:18px 30px 118px repeat(2,64px) 40px;--minw:0}.tb .hd,.tb .rw{gap:0 10px}.rank .who span{display:none}.rank .who b{font-size:14px}}

/* rows of portraits with a count */
.bubbles{display:flex;flex-wrap:wrap;gap:16px 6px;align-items:flex-start}
.bub{display:flex;flex-direction:column;align-items:center;text-align:center;width:84px}
.bub .pf{display:flex;align-items:flex-end;justify-content:center}
.bub b{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1;margin-top:6px}
.bub span.n{font-size:12px;line-height:1.25;margin-top:3px}
.in .bub{animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--r)*60ms)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media (max-width:820px){.two{grid-template-columns:1fr;gap:40px}}

/* the year as a line, and the days of the week */
#line svg{display:block;max-width:100%;overflow:visible}
#line text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
#line .ln{fill:none;stroke:var(--labor);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.in #line .ln{animation:draw 2.2s cubic-bezier(.4,.1,.3,1) both}
.in #line .ar{animation:fadeIn 1s both;animation-delay:1.6s}
.in #line .pk{animation:fadeIn .6s both;animation-delay:calc(1.5s + var(--i)*.18s)}
@keyframes draw{from{stroke-dashoffset:1}}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;max-width:560px;height:170px;margin-top:8px}
.dow div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--ink2)}
.dow i{display:block;width:100%;background:var(--labor);border-radius:2px 2px 0 0;transform-origin:bottom}
.dow b{font-weight:500;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:4px}
.dow span{margin-top:6px}
.in .dow i{animation:growH .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r)*70ms)}

/* the counts */
.facts{margin-top:8px}
.fact{display:grid;grid-template-columns:minmax(92px,150px) 1fr auto;gap:18px 26px;align-items:center;padding:20px 0;border-top:1px solid var(--rule)}
.fact .n{font-family:var(--serif);font-size:clamp(40px,6vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.fact p{font-family:var(--serif);font-size:clamp(18px,2vw,22px);line-height:1.35;color:var(--ink2);max-width:36ch}
.fact p b{color:var(--ink);font-weight:500}
.fact .fs{display:flex;gap:6px}
@media (max-width:620px){.fact{grid-template-columns:76px 1fr}.fact .fs{display:none}}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#f6f3ec;font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:4px;max-width:280px;opacity:0;transition:opacity .12s}
#tip b{font-weight:600}
</style>
</head>
<body>
<div id="prog"></div>
<header class="hero"><div class="wrap">
  <div>
    <div class="kick reveal">16 November 2025 – 15 November 2026</div>
    <h1>Ministry media report</h1>
  </div>
  <div id="pack" class="reveal" role="img" aria-label="The 42 ministers' portraits, each sized by its number of media appearances"></div>
</div></header>

<main>
<section class="sec" id="all"><div class="wrap">
  <h2 id="all-h"></h2>
  <p class="lede reveal" id="all-lede"></p>
  <div class="viz reveal tb" id="tbl-w"><div class="pin"></div><div class="scroll"><div class="rank" id="tbl"></div></div></div>
</div></section>

<section class="sec" id="breakfast"><div class="wrap">
  <h2 id="bf-h"></h2>
  <div class="viz reveal tb bbt" id="bf-w"><div class="pin"></div><div class="scroll"><div class="rank" id="bf"></div></div></div>
  <div class="rounds reveal"><div class="sub">Blitzes</div><p class="subnote">Times a Minister filled at least 3 Breakfast slots on the same day</p><div class="bubbles" id="rounds"></div></div>
</div></section>

<section class="sec" id="flagships"><div class="wrap">
  <h2 id="fl-h"></h2>
  <div class="viz reveal tb bbt" id="fl-w"><div class="pin"></div><div class="scroll"><div class="rank" id="fl"></div></div></div>
</div></section>

<section class="sec" id="days"><div class="wrap">
  <h2 id="days-h"></h2>
  <div class="viz reveal"><div class="sub">Appearances a week</div><div id="line"></div></div>
  <div class="viz reveal"><div class="sub">By day of the week</div><div class="dow" id="dow"></div></div>
</div></section>

<section class="sec" id="counts"><div class="wrap">
  <h2>Other counts</h2>
  <div class="viz facts" id="facts"></div>
</div></section>
</main>

<div id="tip" role="status"></div>

const P = M.people, F = M.facts, byId = Object.fromEntries(P.map(p => [p.id, p]));
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-AU');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr = s => { const d = new Date(s + 'T00:00:00'); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function debounce(f, ms) { let t; return () => { clearTimeout(t); t = setTimeout(f, ms); }; }
function face(id, size) {
  const nm = byId[id] ? byId[id].name : '';
  if (FACES[id]) return `<img class="face" src="${FACES[id]}" width="${size}" height="${size}" alt="${esc(nm)}" loading="lazy">`;
  return `<span class="face ph" style="width:${size}px;height:${size}px">${nm.split(' ').map(w => w[0]).slice(0, 2).join('')}</span>`;
}
const ringFace = (id, size) => `<span class="ring">${face(id, size)}</span>`;

/* tooltip */
const tip = $('#tip');
function moveTip(e) { const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16; tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hover(node, html) { node.addEventListener('mouseenter', e => { tip.innerHTML = typeof html === 'function' ? html() : html; tip.style.opacity = 1; moveTip(e); }); node.addEventListener('mousemove', moveTip); node.addEventListener('mouseleave', () => { tip.style.opacity = 0; }); }

/* 00 the ministry as a crowd: a portrait's area is its owner's appearances */
(function () {
  const box = $('#pack');
  const draw = () => {
    box.querySelectorAll('.b').forEach(b => b.remove());
    const W = box.clientWidth, H = box.clientHeight; if (!W) return;
    const sum = P.reduce((a, p) => a + p.total, 0), k = Math.sqrt(.46 * W * H / (Math.PI * sum)), placed = [];
    P.forEach((p, i) => {
      const r = Math.max(11, k * Math.sqrt(p.total)); let x = W / 2, y = H / 2;
      for (let t = 0; t < 6000; t++) {
        const a = t * .35, d = 1.5 * Math.sqrt(t) * 2.2; x = W / 2 + d * Math.cos(a) * (W / H); y = H / 2 + d * Math.sin(a);
        if (x - r < 0 || y - r < 0 || x + r > W || y + r > H) continue;
        if (!placed.some(q => (q.x - x) ** 2 + (q.y - y) ** 2 < (q.r + r + 3) ** 2)) break;
      }
      placed.push({x, y, r});
      const b = el('div', 'b', FACES[p.id] ? `<img src="${FACES[p.id]}" alt="${esc(p.name)}">` : `<span class="ph">${p.name.split(' ').map(w => w[0]).join('')}</span>`);
      b.style.cssText = `left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;--i:${i}`;
      hover(b, `<b>${esc(p.name)}</b><br>${esc(p.role)}<br>${fmt(p.total)} appearances`);
      box.appendChild(b);
    });
  };
  draw(); let lastW = innerWidth; addEventListener('resize', debounce(() => { if (innerWidth !== lastW) { lastW = innerWidth; draw(); } }, 200));
})();

/* a ranked grid whose rows move to their new places when a column is chosen */
function ranked(box, rows, cols, make, start) {
  let key = start;
  const wrap = box.closest('.tb'), pin = wrap.querySelector('.pin'), scroller = wrap.querySelector('.scroll');
  const head = el('div', 'hd', '<span></span><span></span><span></span>' + cols.map(c => `<button type="button" data-k="${c.k}" aria-pressed="${c.k === start}">${c.name}</button>`).join(''));
  pin.appendChild(head);
  scroller.addEventListener('scroll', () => { pin.scrollLeft = scroller.scrollLeft; }, {passive: true});
  const nodes = new Map(rows.map(p => [p.id, make(p)]));
  const order = () => [...rows].sort((a, b) => cols.find(c => c.k === key).v(b) - cols.find(c => c.k === key).v(a) || b.total - a.total);
  function place(animate) {
    const before = new Map([...nodes].map(([id, n]) => [id, n.getBoundingClientRect().top]));
    order().forEach((p, i) => { const n = nodes.get(p.id); n.style.setProperty('--r', i); n.querySelector('.rk').textContent = i + 1; box.appendChild(n); });
    nodes.forEach(n => n.querySelectorAll('.c').forEach(c => c.classList.toggle('on', c.dataset.k === key)));
    if (!animate || reduce) return;
    nodes.forEach((n, id) => {
      const dy = before.get(id) - n.getBoundingClientRect().top; if (!dy) return;
      n.style.animation = 'none'; n.style.zIndex = dy > 0 ? 2 : 1;
      n.animate([{transform: `translateY(${dy}px)`}, {transform: 'none'}], {duration: 650, easing: 'cubic-bezier(.2,.7,.2,1)'}).onfinish = () => { n.style.zIndex = ''; };
    });
  }
  head.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { key = b.dataset.k; head.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); place(true); }));
  place(false);
}

  $('#all-lede').innerHTML = `Or <b class="num">${Math.round(F.appearances / 365)}</b> per day.`;
  const cols = [['total', 'Total'], ['doorstop', 'Doorstops'], ['presser', 'Press conferences'], ['tv', 'TV'], ['radio_metro', 'Metro radio'], ['radio_regional', 'Regional radio'], ['radio_national', 'National radio'], ['podcast', 'Podcasts']]
    .map(([k, name]) => ({k, name, v: p => p[k], max: Math.max(...P.map(p => p[k]))}));
  ranked($('#tbl'), P, cols, p => {
    const r = el('div', 'rw', `<span class="rk"></span>${face(p.id, 40)}<span class="who"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></span>` +
      cols.map(c => `<span class="c${c.k === 'total' ? ' t' : ''}${p[c.k] ? '' : ' z'}" data-k="${c.k}">${p[c.k]}<i style="width:${p[c.k] / c.max * 100}%"></i></span>`).join(''));
    hover(r, `<b>${esc(p.name)}</b><br>on ${p.days} days of the year<br>busiest: ${p.busiest.n} on ${dstr(p.busiest.day)}${p.host ? `<br>most often with ${esc(p.host.name)} (${p.host.n})` : ''}`);

  }, 'total');
})();

    `<span class="c t" data-k="breakfast">${p.breakfast}</span>`), 'breakfast');
  const rb = $('#rounds'), bl = P.filter(p => p.blitz).sort((a, b) => b.blitz - a.blitz || b.breakfast - a.breakfast), bmx = bl[0].blitz;

/* 03 Insiders and 7.30: the same grid as the breakfast shows */
(function () {
  $('#fl-h').textContent = `${F.insiders_total} on Insiders, ${F.p730_total} on 7.30`;
  const rows = P.filter(p => p.insiders + p.p730), mx = Math.max(...rows.map(p => Math.max(p.insiders, p.p730)));
  const cols = [{k: 'insiders', name: 'Insiders', v: p => p.insiders}, {k: 'p730', name: '7.30', v: p => p.p730}, {k: 'both', name: 'Total', v: p => p.insiders + p.p730}];
  ranked($('#fl'), rows, cols, p => el('div', 'rw', `<span class="rk"></span>${face(p.id, 36)}<span class="who"><b>${esc(p.name)}</b></span>` +
    ['insiders', 'p730'].map((k, j) => { const n = p[k], d = Math.round(18 + 28 * Math.sqrt(n / mx)); return `<span class="c bb" data-k="${k}"><span class="${n ? '' : 'z'}" style="width:${d}px;height:${d}px;--k:${j}">${n || ''}</span></span>`; }).join('') +
    `<span class="c t" data-k="both">${p.insiders + p.p730}</span>`), 'both');
})();

/* 04 the year as a line: appearances in the week to each day, with the busiest weeks named */
(function () {
  $('#days-h').textContent = 'Most active periods';                      // [user] 17 Nov 2026
  const start = new Date('2025-11-16T00:00:00'), N = 365;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const dayOf = i => iso(new Date(start.getTime() + i * 864e5 + 36e5)), c = [], r = [];
  for (let i = 0; i < N; i++) { const v = F.calendar[dayOf(i)]; c.push(v ? v[0] : 0); }
  for (let i = 6; i < N; i++) { let s = 0; for (let j = i - 6; j <= i; j++) s += c[j]; r.push({i, v: s}); }
  const peaks = []; [...r].sort((a, b) => b.v - a.v).forEach(p => { if (peaks.length < 5 && peaks.every(q => Math.abs(q.i - p.i) >= 18)) peaks.push(p); });
  const low = r.reduce((a, b) => b.v < a.v ? b : a), mx = Math.max(...r.map(p => p.v)), top = Math.ceil(mx / 25) * 25;
  const named = i => { const d = dayOf(i), m = F.periods.find(p => d >= p[0] && d <= p[1]); return m ? m[2] : null; };
  const short = i => { const d = new Date(dayOf(i) + 'T00:00:00'); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
  const draw = () => {
    const box = $('#line'), W = box.clientWidth; if (!W) return;
    const narrow = W < 600, H = narrow ? 250 : 320, L = 30, R = 10, T = 58, B = 26, x = i => L + (i - 6) / (N - 7) * (W - L - R), y = v => T + (1 - v / top) * (H - T - B);
    let svg = `<svg width="${W}" height="${H}" role="img" aria-label="Ministers' media appearances in the week to each day of the year; the busiest was the week to ${dstr(dayOf(peaks[0].i))} with ${peaks[0].v}">`;
    for (let v = 0; v <= top; v += 50) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    for (let i = 6; i < N; i++) { const d = new Date(dayOf(i) + 'T00:00:00'); if (d.getDate() === 1) svg += `<text x="${x(i)}" y="${H - 6}">${MONTHS[d.getMonth()]}</text>`; }
    const pts = r.map(p => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' L');
    svg += `<path class="ar" d="M${pts} L${x(N - 1)},${y(0)} L${x(6)},${y(0)} Z" fill="var(--labor)" fill-opacity=".1"/><path class="ln" pathLength="1" d="M${pts}"/>`;
    // two busy weeks close together: the left one's label runs left of its dot, the right one's runs right
    const shown = [...peaks].slice(0, narrow ? 3 : 5).sort((a, b) => a.i - b.i), side = shown.map(p => x(p.i) > W - 100 ? 'end' : x(p.i) < 100 ? 'start' : 'middle');
    for (let k = 0; k + 1 < shown.length; k++) if (x(shown[k + 1].i) - x(shown[k].i) < (narrow ? 90 : 110)) { if (side[k] === 'middle') side[k] = 'end'; side[k + 1] = 'start'; }
    shown.forEach((p, k) => {
      const px = x(p.i), py = y(p.v), nm = named(p.i), txt = `${nm || 'Week to ' + short(p.i)}, ${p.v}`, dx = side[k] === 'end' ? -7 : side[k] === 'start' ? 7 : 0;
      svg += `<g class="pk" style="--i:${k}"><circle cx="${px}" cy="${py}" r="4" fill="var(--ink)"/><text x="${px + dx}" y="${py - (dx ? 9 : 12)}" text-anchor="${side[k]}" style="fill:var(--ink);font-size:13px">${txt}</text></g>`;
    });
    svg += `<g class="pk" style="--i:5"><circle cx="${x(low.i)}" cy="${y(low.v)}" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/><text x="${x(low.i) + 9}" y="${y(low.v) + 4}" style="fill:var(--ink);font-size:13px">${named(low.i) || 'Week to ' + short(low.i)}, ${low.v}</text></g>`;
    svg += `<line id="ln-g" y1="${T - 6}" y2="${y(0)}" stroke="var(--ink)" stroke-width=".8" visibility="hidden"/><rect id="ln-h" x="${L}" y="${T - 6}" width="${W - L - R}" height="${y(0) - T + 6}" fill="transparent"/>`;
    box.innerHTML = svg + '</svg>';
    const g = box.querySelector('#ln-g'), hit = box.querySelector('#ln-h');
    const at = e => { const fx = (e.clientX - box.getBoundingClientRect().left - L) / (W - L - R); return r[Math.max(0, Math.min(r.length - 1, Math.round(fx * (r.length - 1))))]; };
    hit.addEventListener('mousemove', e => { const p = at(e); g.setAttribute('x1', x(p.i)); g.setAttribute('x2', x(p.i)); g.setAttribute('visibility', 'visible'); tip.innerHTML = `<b>Week to ${dstr(dayOf(p.i))}</b><br>${p.v} appearances`; tip.style.opacity = 1; moveTip(e); });
    hit.addEventListener('mouseleave', () => { g.setAttribute('visibility', 'hidden'); tip.style.opacity = 0; });
  };
  draw(); let lastW = innerWidth; addEventListener('resize', debounce(() => { if (innerWidth !== lastW) { lastW = innerWidth; draw(); } }, 200));
  const mxd = Math.max(...F.dow);
  ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach((t, i) => { $('#dow').appendChild(el('div', '', `<b>${fmt(F.dow[i])}</b><i style="height:${F.dow[i] / mxd * 78}%;--r:${i}"></i><span>${t}</span>`)); });
})();

/* 05 other counts */
(function () {
  const top = P[0], bd = F.busiest_days[0], md = F.busiest_ministry_days[0], pr = F.pairs[0], bp = F.beside_pm[0];
  const n24 = [...P].sort((a, b) => b.news24 - a.news24)[0], reg = [...P].sort((a, b) => b.radio_regional - a.radio_regional)[0], met = [...P].sort((a, b) => b.radio_metro - a.radio_metro).filter(p => p.id !== 'R36')[0];
  const wk = [...P].sort((a, b) => b.weekend - a.weekend), pod = F.podcasts.top[0];
  const rows = [
    [bd.n, `interviews and press conferences by <b>${esc(bd.name)}</b> on Budget sell day, ${dstr(bd.day)}`, [bd.id]],
    [md.n, `appearances by ${md.ministers} ministers that same day`, []],
    [F.pm_days, `days on which the <b>Prime Minister</b> appeared`, ['R36']],
    [reg.radio_regional, `regional radio interviews by <b>${esc(reg.name)}</b>, the most of any minister`, [reg.id]],
    [wk[0].weekend, `weekend appearances each by <b>${esc(wk[0].name)}</b> and <b>${esc(wk[1].name)}</b>`, [wk[0].id, wk[1].id]],
    [pod.n, `of the ministry's ${F.podcasts.total} podcast appearances were <b>${esc(pod.name)}</b>'s`, [pod.id]],
  ];
  rows.forEach(([n, text, ids]) => $('#facts').appendChild(el('div', 'fact reveal', `<div class="n" data-count="${n}">${fmt(n)}</div><p>${text}</p><div class="fs">${ids.map(i => ringFace(i, 52)).join('')}</div>`)));
})();

/* reveals */
(function () {
  document.querySelectorAll('.hero h1, .sec h2').forEach(h => {
    h.innerHTML = h.textContent.trim().split(/\s+/).map((w, i) => {
      const num = /^[\d,.]+$/.test(w) && (i === 0 || h.id === 'fl-h');
      return `<span class="w${num ? ' num' : ''}" style="--i:${i}"${num ? ` data-count="${w.replace(/,/g, '')}" data-dec="${(w.split('.')[1] || '').length}"` : ''}>${esc(w)}</span>`;
    }).join(' ');
    h.classList.add('reveal', 'byword');
  });
  function countUp(node) {
    const to = +node.dataset.count, dec = +(node.dataset.dec || 0), t0 = performance.now();
    const f = now => { const t = Math.min(1, (now - t0) / 1400), v = to * (1 - Math.pow(1 - t, 3)); node.textContent = dec ? v.toFixed(dec) : fmt(v); if (t < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }
  const fire = t => { t.classList.add('in'); if (!reduce) (t.matches('[data-count]') ? [t] : [...t.querySelectorAll('[data-count]')]).forEach(countUp); };
  const rv = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting || e.intersectionRect.height + 1 < Math.min(e.boundingClientRect.height * .3, innerHeight * .22)) return;
    fire(e.target); rv.unobserve(e.target);
  }), {rootMargin: '0px 0px -6% 0px', threshold: [0, .02, .05, .1, .15, .2, .25, .3, .4, .6, 1]});
  document.querySelectorAll('.reveal').forEach(r => rv.observe(r));
  let f0 = null; const guard = ts => { if (document.querySelector('.reveal.in')) return; if (f0 == null) f0 = ts; if (ts - f0 > 2500) document.querySelectorAll('.reveal').forEach(fire); else requestAnimationFrame(guard); };
  requestAnimationFrame(guard);
  const prog = $('#prog'), sc = () => { prog.style.transform = `scaleX(${Math.min(1, scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight))})`; };
  addEventListener('scroll', sc, {passive: true}); sc();
})();
</script>
